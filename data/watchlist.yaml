# The bot supports any number of active entries.
#
# exact_card:
#   Requires an exact Pokemon name and printed card number.
#
# pokemon_general:
#   Matches any card for the named Pokemon. accepted_sets and
#   accepted_set_codes are optional; omit them to allow every set.

cards:
  - id: ampharos_ex_xy7_027
    active: false
    match_mode: exact_card
    english_name: "Ampharos EX"
    japanese_name: "デンリュウEX"
    set_name: "Bandit Ring"
    set_code: "XY7"
    card_number: "027/081"
    rarity: "RR"
    language: "Japanese"

    # Optional for exact_card entries. The bot checks this page first, verifies
    # that its title/URL matches the identified card, and falls back to normal
    # PriceCharting search if the page is unavailable or does not match.
    pricecharting_url: "https://www.pricecharting.com/game/pokemon-japanese-bandit-ring/ampharos-ex-27"

    search_terms:
      - "デンリュウEX 027/081"
      - "デンリュウEX XY7"
      - "Ampharos EX 027/081 Japanese"

    # Tier 2 broad-lot discovery intentionally removes the Pokemon name from
    # most queries. Gemini still has to identify Ampharos EX 027/081 in the
    # listing photos before an alert can qualify. The XY-era searches increase
    # the chance of finding the target without reverting to exact-card listings.
    lot_search_terms:
      - "ポケカ まとめ売り"
      - "ポケモンカード まとめ売り"
      - "ポケカ 引退品"
      - "ポケカ 大量"
      - "ポケカ XY まとめ売り"
      - "バンデットリング まとめ売り"

  # General-search example. Change active to true to search for any Tyranitar
  # across the four main Neo-era sets at the same time as Ampharos EX.
  - id: tyranitar_neo_era
    active: true
    match_mode: pokemon_general
    english_names:
      - "Tyranitar"
      - "Dark Tyranitar"
      - "Shining Tyranitar"
    japanese_names:
      - "バンギラス"
      - "わるいバンギラス"
      - "ひかるバンギラス"
    language: "Japanese"
    accepted_sets:
      - "Neo Genesis"
      - "Gold, Silver, to a New World..."
      - "Neo Discovery"
      - "Crossing the Ruins..."
      - "Neo Revelation"
      - "Awakening Legends"
      - "Neo Destiny"
      - "Darkness, and to Light..."
    search_terms:
      - "バンギラス 旧裏"
      - "バンギラス neo"
      - "わるいバンギラス"
      - "ひかるバンギラス"
      - "Tyranitar Neo Japanese"
      - "Dark Tyranitar Japanese"
      - "Shining Tyranitar Japanese"
