[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sendico-pokemon-deal-bot"
version = "0.1.0"
description = "Monitor Sendico Mercari Pokemon card listings, value Japanese card lots, and alert Discord."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "playwright>=1.49,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
pokemon-deal-bot = "pokemon_deal_bot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
