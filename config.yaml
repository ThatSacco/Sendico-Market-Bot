marketplace: mercari
currency: AUD
minimum_seller_positive_ratings: 301
minimum_saving_percent: 20.0
shipping_allowance_aud: 0.0

test_mode:
  # TEMPORARY DIAGNOSTIC MODE.
  # This run targets the known 16-card listing so the two-pass crop method can
  # be tested without waiting for search ordering to return a suitable lot.
  enabled: true
  max_alerts_per_run: 1
  ignore_seen_state: true
  skip_search_when_direct_urls: true
  direct_listing_urls:
    - "https://sendico.com/shop/mercari/catalog/m10381389468"

seller_verification:
  # Production behaviour once test_mode is disabled.
  analyse_unverified_sellers: true
  alert_provisional_deals: true

sendico:
  category_url: "https://sendico.com/shop/mercari/catalog/categories/1289"
  max_results_per_search: 20
  max_listings_per_run: 1
  page_timeout_ms: 60000
  search_terms:
    - "ビクティニ AR まとめ売り"
    - "ビクティニ ポケモンカード セット"
    - "ポケモンカード まとめ売り ビクティニ"
    - "ビクティニ 097/086"

vision:
  enabled: true
  model: "gemini-3.6-flash"
  max_images_per_listing: 8
  minimum_card_confidence: 0.78
  minimum_target_confidence: 0.85
  maximum_cards_to_price: 100

  # Two-pass lot analysis costs at most two Gemini requests per listing:
  # one overview request plus one batched request containing enlarged crops.
  two_pass_enabled: true
  two_pass_listing_types:
    - "lot"
    - "collection"
  max_crops_per_listing: 16
  crop_minimum_confidence: 0.40
  crop_padding_percent: 0.06
  crop_max_dimension_px: 1400

pricing:
  request_delay_seconds: 1.2
  cache_hours: 12
  manual_usd_to_aud: 1.52
  manual_jpy_to_aud: 0.0102

sendico_fee:
  before_2026_08_01_jpy: 500
  from_2026_08_01_jpy: 800

discord:
  username: "Pokemon Deal Scout"
  enabled: true
