marketplace: mercari
currency: AUD
minimum_seller_positive_ratings: 301
shipping_allowance_aud: 0.0

retry_policy:
  max_attempts_per_listing: 3

test_mode:
  enabled: false
  max_alerts_per_run: 1
  ignore_seen_state: false
  skip_search_when_direct_urls: true
  direct_listing_urls: []

seller_verification:
  analyse_unverified_sellers: true
  alert_provisional_deals: true

sendico:
  category_url: "https://sendico.com/shop/mercari/catalog/categories/1289"

  # Operational safety limits only. All actual search wording lives in
  # data/watchlist.yaml and is never generated from card names or config values.
  max_results_per_search: 15
  max_listings_per_run: 30
  prefilter_watchlist_relevance: true
  max_raw_links_per_search: 40

  tier2_lot_search:
    enabled: true
    # Exact searches are supported when a watchlist search has mode: exact.
    # For the default Ampharos test the exact search is inactive.
    run_standard_watchlist_searches: true
    max_results_per_search: 15
    allow_query_only_candidates: false

    screening_enabled: true
    screening_model: "gemini-3.5-flash-lite"
    screening_fallback_models:
      - "gemini-3.6-flash"
    screening_confidence_threshold: 0.45
    max_screenings_per_run: 15
    era_set_screening_limit: 15
    # Generic searches are inactive in the default watchlist. If deliberately
    # enabled later, no more than three generic candidates are screened.
    generic_screening_limit: 3
    screening_max_overview_images: 4
    screening_max_dimension_px: 1400
    screening_jpeg_quality: 78

    max_detailed_analyses_per_run: 3
    detailed_max_overview_images: 8
    require_strong_lot_evidence: true
    lot_evidence_terms:
      - "まとめ売り"
      - "大量"
      - "引退品"
      - "引退"
      - "詰め合わせ"
      - "セット販売"
      - "lot"
      - "bundle"
      - "collection"
      - "bulk"
      - "assorted"

  page_timeout_ms: 60000
  maximum_scroll_rounds: 5
  stable_scroll_rounds_before_stop: 2
  scroll_pause_ms: 1200

  # Retained only for compatibility with main.py. Keep false/empty: the runtime
  # accepts search terms exclusively from data/watchlist.yaml.
  use_legacy_config_search_terms: false
  search_terms: []

vision:
  enabled: true
  provider: "gemini"
  pipeline_state_version: "watchlist-only-bounded-v4"
  models:
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"
  model: "gemini-3.6-flash"
  api_version: "v1beta"
  api_revision: "2026-05-20"
  thinking_level: "low"
  max_model_attempts_per_request: 2
  max_retries_per_model: 2
  retry_base_seconds: 2.0
  retry_max_seconds: 30.0
  request_timeout_seconds: 240

  max_images_per_listing: 12
  max_local_crops_per_listing: 40
  local_analysis_max_dimension_px: 2200
  crop_max_dimension_px: 1400
  crop_jpeg_quality: 86
  crop_padding_percent: 0.025
  minimum_card_area_ratio: 0.012
  maximum_card_area_ratio: 0.98
  minimum_rectangularity: 0.58
  card_aspect_ratio_min: 0.52
  card_aspect_ratio_max: 0.84
  duplicate_phash_distance: 10

  # Final run-level safeguards. Tier 2 also has its own tighter 15/3 limits.
  max_listing_analyses_per_run: 3
  max_vision_requests_per_run: 30
  crop_batch_size: 4
  request_spacing_seconds: 1.0
  contact_sheet_max_dimension_px: 1100
  contact_sheet_jpeg_quality: 82
  max_completion_tokens: 1600
  minimum_card_confidence: 0.95
  minimum_target_confidence: 0.85
  maximum_cards_to_price: 40

pricing:
  request_delay_seconds: 1.2
  cache_hours: 12
  manual_usd_to_aud: 1.52
  manual_jpy_to_aud: 0.0102
  minimum_match_confidence: 0.95

sendico_fee:
  before_2026_08_01_jpy: 800
  from_2026_08_01_jpy: 800

discord:
  username: "Pokemon Deal Scout"
  enabled: true
  send_completion_summary: true
