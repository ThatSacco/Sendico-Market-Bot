marketplace: mercari
currency: AUD
minimum_seller_positive_ratings: 301
shipping_allowance_aud: 0.0

# Production mode. GitHub Actions runs this scanner twice per week.
test_mode:
  enabled: false
  max_alerts_per_run: 1
  ignore_seen_state: false
  skip_search_when_direct_urls: true
  direct_listing_urls: []

seller_verification:
  # Listings with an unavailable rating can create a provisional Discord alert.
  # Any verified seller below 301 positives is rejected.
  analyse_unverified_sellers: true
  alert_provisional_deals: true

sendico:
  category_url: "https://sendico.com/shop/mercari/catalog/categories/1289"
  max_results_per_search: 20
  # Ten listings means a maximum of about 20 Gemini requests per scheduled run
  # when every listing requires both overview and crop passes.
  max_listings_per_run: 10
  page_timeout_ms: 60000
  search_terms:
    - "ビクティニ AR まとめ売り"
    - "ビクティニ ポケモンカード セット"
    - "ポケモンカード まとめ売り ビクティニ"
    - "ビクティニ 097/086"

vision:
  enabled: true
  model: "gemini-3.6-flash"
  # Review several Sendico photos. Alternative views help verify card variants
  # and condition without being counted as additional physical cards.
  max_images_per_listing: 12

  # Price and include every Japanese card Gemini identifies at 95% or higher.
  minimum_card_confidence: 0.95
  minimum_target_confidence: 0.85
  maximum_cards_to_price: 100

  # Two Gemini requests maximum per lot: overview plus one batched crop request.
  two_pass_enabled: true
  two_pass_listing_types:
    - "lot"
    - "collection"
  max_crops_per_listing: 16
  crop_minimum_confidence: 0.40
  crop_padding_percent: 0.06
  crop_max_dimension_px: 1400
  supporting_images_in_crop_pass: 6

pricing:
  request_delay_seconds: 1.2
  cache_hours: 12
  manual_usd_to_aud: 1.52
  manual_jpy_to_aud: 0.0102

  # Accept a PriceCharting candidate when the combined card-name, printed-number
  # and Japanese-set match is at least 95%.
  minimum_match_confidence: 0.95

sendico_fee:
  before_2026_08_01_jpy: 800
  from_2026_08_01_jpy: 800

discord:
  username: "Pokemon Deal Scout"
  enabled: true
