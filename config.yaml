marketplace: mercari
currency: AUD
minimum_seller_positive_ratings: 301
shipping_allowance_aud: 0.0

# An unchanged listing with a retryable failure is attempted no more than three
# times in total. If its price, title, seller rating or images change, the
# fingerprint changes and the counter starts again for the updated listing.
retry_policy:
  max_attempts_per_listing: 3

# Production mode. The workflow runs once per week at midnight Thursday in Sydney.
test_mode:
  enabled: false
  max_alerts_per_run: 1
  ignore_seen_state: false
  skip_search_when_direct_urls: true
  direct_listing_urls: []

seller_verification:
  # Listings with an unavailable rating can create a provisional Discord alert.
  # Any verified seller below 301 positives is rejected.
  analyse_unverified_sellers: true
  alert_provisional_deals: true

sendico:
  category_url: "https://sendico.com/shop/mercari/catalog/categories/1289"

  # Zero means no configured cap. Previously processed unchanged listings are
  # skipped, and the run pauses cleanly if the Groq free-tier limit is reached.
  max_results_per_search: 0
  max_listings_per_run: 0
  page_timeout_ms: 60000

  # Zero means no fixed scroll-round cap. Scrolling stops after three rounds
  # with no new unique Mercari listing links.
  maximum_scroll_rounds: 0
  stable_scroll_rounds_before_stop: 3
  scroll_pause_ms: 1500

  search_terms:
    - "ビクティニ AR まとめ売り"
    - "ビクティニ ポケモンカード セット"
    - "ポケモンカード まとめ売り ビクティニ"
    - "ビクティニ 097/086"

vision:
  enabled: true
  provider: "groq"
  model: "qwen/qwen3.6-27b"

  # Download up to 12 Sendico photos, then detect and crop card-shaped regions
  # locally with OpenCV. Overview photos are no longer sent to Groq.
  max_images_per_listing: 12
  max_local_crops_per_listing: 40
  local_analysis_max_dimension_px: 2200
  crop_max_dimension_px: 1400
  crop_jpeg_quality: 86
  crop_padding_percent: 0.025

  # Conservative local rectangle filters for standard Pokemon-card proportions.
  minimum_card_area_ratio: 0.012
  maximum_card_area_ratio: 0.98
  minimum_rectangularity: 0.58
  card_aspect_ratio_min: 0.52
  card_aspect_ratio_max: 0.84

  # Perceptual hashing removes alternate-photo views without merging two
  # identical physical cards that appear together in the same overview photo.
  duplicate_phash_distance: 10

  # Each Groq request contains one small JPEG contact sheet. Four crops per
  # request is deliberately conservative for the 8,000 TPM free-tier limit.
  # Requests are spaced beyond one minute so separate batches do not overlap in
  # the same TPM window. A 413 request-too-large response is split automatically.
  crop_batch_size: 4
  request_spacing_seconds: 65
  contact_sheet_max_dimension_px: 1100
  contact_sheet_jpeg_quality: 82
  max_completion_tokens: 1600

  # Price and include every Japanese card identified at 95% or higher.
  minimum_card_confidence: 0.95
  minimum_target_confidence: 0.85
  maximum_cards_to_price: 100

pricing:
  request_delay_seconds: 1.2
  cache_hours: 12
  manual_usd_to_aud: 1.52
  manual_jpy_to_aud: 0.0102

  # Accept a PriceCharting candidate when the combined card-name, printed-number
  # and Japanese-set match is at least 95%.
  minimum_match_confidence: 0.95

sendico_fee:
  before_2026_08_01_jpy: 800
  from_2026_08_01_jpy: 800

discord:
  username: "Pokemon Deal Scout"
  enabled: true
