marketplace: mercari
currency: AUD
minimum_seller_positive_ratings: 301
minimum_saving_percent: 20.0
shipping_allowance_aud: 0.0

test_mode:
  # TEMPORARY DIAGNOSTIC MODE.
  # Sends a Discord result for up to three listings even if Victini is absent,
  # the seller rating is unavailable, or the saving is below 20%.
  enabled: true
  max_alerts_per_run: 3
  ignore_seen_state: true

seller_verification:
  # Production behaviour once test_mode is disabled.
  analyse_unverified_sellers: true
  alert_provisional_deals: true

sendico:
  category_url: "https://sendico.com/shop/mercari/catalog/categories/1289"
  max_results_per_search: 20
  max_listings_per_run: 6
  page_timeout_ms: 60000
  search_terms:
    - "ビクティニ まとめ売り"
    - "ビクティニ ポケモンカード セット"
    - "ビクティニ ポケカ コレクション"
    - "ポケモンカード まとめ売り ビクティニ"
    - "ビクティニ 097/086"

vision:
  enabled: true
  model: "gemini-3.6-flash"
  max_images_per_listing: 8
  minimum_card_confidence: 0.78
  minimum_target_confidence: 0.85
  maximum_cards_to_price: 100

pricing:
  request_delay_seconds: 1.2
  cache_hours: 12
  manual_usd_to_aud: 1.52
  manual_jpy_to_aud: 0.0102

sendico_fee:
  before_2026_08_01_jpy: 500
  from_2026_08_01_jpy: 800

discord:
  username: "Pokemon Deal Scout"
  enabled: true
