name: Scan Sendico Pokemon Deals

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday at 00:00 UTC.
    # Approximately 10:00 AEST or 11:00 AEDT in Sydney.
    - cron: "0 0 * * 1,4"

permissions:
  contents: write

concurrency:
  group: sendico-pokemon-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      - name: Scan and send alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pokemon_deal_bot.main --config config.yaml

      - name: Persist scanner state and latest report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/price_cache.json reports/latest.json reports/latest.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Update deal scanner state [skip ci]"
            git push
          fi
