name: Scan Sendico Pokemon Deals

on:
  workflow_dispatch:
  schedule:
    # Sydney midnight Thursday is Wednesday 13:00 UTC during AEDT and
    # Wednesday 14:00 UTC during AEST. Both are scheduled; the guard below
    # permits only the trigger that is actually midnight in Australia/Sydney.
    - cron: "0 13 * * 3"
    - cron: "0 14 * * 3"

permissions:
  contents: write

concurrency:
  group: sendico-pokemon-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Sydney schedule
        id: schedule_guard
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Australia/Sydney"))
          should_run = event_name == "workflow_dispatch" or (
              now.weekday() == 3 and now.hour == 0
          )

          print(f"Sydney time: {now.isoformat()}")
          print(f"Workflow event: {event_name}")
          print(f"Run scanner: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: Run tests
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: pytest -q

      - name: Scan and send alerts
        if: steps.schedule_guard.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pokemon_deal_bot.main --config config.yaml

      - name: Persist scanner state and latest report
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/price_cache.json reports/latest.json reports/latest.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Update deal scanner state [skip ci]"
            git push
          fi
