name: Manual Sendico Pokemon Deal Search

on:
  workflow_dispatch:
    inputs:
      watchlist_id:
        description: "Active id from data/watchlist.yaml"
        required: true
        default: "ampharos_ex_xy7_027"
        type: string
      pricecharting_url:
        description: "Direct PriceCharting /game/ product URL for the selected card"
        required: true
        type: string
      results_per_term:
        description: "Maximum usable Sendico results retained per watchlist term"
        required: true
        default: "15"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
      screening_limit:
        description: "Maximum listings sent to low-cost Gemini screening"
        required: true
        default: "15"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
      detailed_limit:
        description: "Maximum probable matches sent to detailed Gemini analysis"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: write

concurrency:
  group: sendico-pokemon-manual-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SENDICO_WATCHLIST_ID: ${{ inputs.watchlist_id }}
      SENDICO_PRICECHARTING_URL: ${{ inputs.pricecharting_url }}
      SENDICO_RESULTS_PER_TERM: ${{ inputs.results_per_term }}
      SENDICO_SCREENING_LIMIT: ${{ inputs.screening_limit }}
      SENDICO_DETAILED_LIMIT: ${{ inputs.detailed_limit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      - name: Validate watchlist search inputs
        run: python -m pokemon_deal_bot.manual_main --config config.yaml --validate-only

      - name: Scan and send alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pokemon_deal_bot.manual_main --config config.yaml

      - name: Persist scanner state and latest report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/price_cache.json reports/latest.json reports/latest.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Update manual deal scanner state [skip ci]"
            git push
          fi
