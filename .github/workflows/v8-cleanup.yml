name: Finalize v8 Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sendico-v8-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify v8 files are present
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "config.yaml"
            "data/watchlist.yaml"
            "data/run_limits.yaml"
            "data/search_criteria.yaml"
            "data/reference_cache.json"
            "src/pokemon_deal_bot/config.py"
            "src/pokemon_deal_bot/discord.py"
            "src/pokemon_deal_bot/gemini.py"
            "src/pokemon_deal_bot/image_processing.py"
            "src/pokemon_deal_bot/main.py"
            "src/pokemon_deal_bot/models.py"
            "src/pokemon_deal_bot/reference.py"
            "src/pokemon_deal_bot/reporting.py"
            "src/pokemon_deal_bot/sendico.py"
            "src/pokemon_deal_bot/state.py"
            "tests/test_config.py"
            "tests/test_gemini.py"
            "tests/test_image_processing.py"
            "tests/test_main_helpers.py"
            "tests/test_reference.py"
            "tests/test_repository.py"
            "tests/test_sendico.py"
            "tests/test_state.py"
          )

          missing=0
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required v8 file: $path"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Upload all v8.1 files before running this cleanup workflow."
            exit 1
          fi

      - name: Remove superseded files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            .update_backups \
            .pytest_cache \
            tests/fixtures

          rm -f \
            FRESH_UPLOAD_INSTRUCTIONS.md \
            GEMINI_MIGRATION_NOTES.md \
            GITHUB_FILE_UPLOAD_INSTRUCTIONS.md \
            README_UPDATE.md \
            RUN_LIMITS_GUIDE.md \
            SHA256SUMS.txt \
            UPDATE_INSTRUCTIONS.md \
            UPDATE_MANIFEST.md \
            UPDATE_NOTES.md \
            UPLOAD_MANIFEST.md \
            WATCHLIST_GUIDE.md \
            WORKING_BACKUP_NOTES.md \
            GITHUB_UPLOAD_AND_CLEANUP.md \
            V8_1_UPLOAD_INSTRUCTIONS.md \
            apply_v5_update.py \
            verify_v5_update.py \
            verify_watchlist_update.py

          rm -f \
            src/pokemon_deal_bot/deal.py \
            src/pokemon_deal_bot/fx.py \
            src/pokemon_deal_bot/gemini_vision.py \
            src/pokemon_deal_bot/groq_model_pool.py \
            src/pokemon_deal_bot/pricecharting.py \
            src/pokemon_deal_bot/tier2_vision.py \
            src/pokemon_deal_bot/updated_main.py \
            src/pokemon_deal_bot/vision.py

          rm -f \
            tests/test_deal.py \
            tests/test_discord.py \
            tests/test_fx.py \
            tests/test_gemini_vision.py \
            tests/test_grading.py \
            tests/test_groq_json_fallback.py \
            tests/test_groq_vision_discovery.py \
            tests/test_main.py \
            tests/test_parsers.py \
            tests/test_pricecharting_matching.py \
            tests/test_pricecharting_reference.py \
            tests/test_repository_integrity.py \
            tests/test_updated_main.py \
            tests/test_v5_token_pipeline.py \
            tests/test_vision.py

          rm -f \
            data/price_cache.json \
            data/price_overrides.csv

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate clean v8 repository
        run: |
          python -m compileall -q src
          pytest -q

      - name: Remove one-time cleanup workflow
        shell: bash
        run: rm -f .github/workflows/v8-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were required."
          else
            git commit -m "Finalize PriceCharting reference matcher v8 cleanup [skip ci]"
            git push
          fi
