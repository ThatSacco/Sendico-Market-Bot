name: Apply verified-only alert fix

on:
  push:
    branches:
      - fix/verified-only-alerts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/verified-only-alerts

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply verified-only rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pokemon_deal_bot/main.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _report_match(
'''
          new = '''def _match_passes(match: VisualMatch | None, threshold: float) -> bool:
    """Return true only for a positive same-card decision above threshold."""
    return bool(
        match is not None
        and match.same_card
        and match.confidence >= float(threshold)
    )


def _prefer_match(current: VisualMatch | None, candidate: VisualMatch) -> VisualMatch:
    """Prefer positive decisions, then the stronger confidence."""
    if current is None:
        return candidate
    current_rank = (int(current.same_card), current.confidence)
    candidate_rank = (int(candidate.same_card), candidate.confidence)
    return candidate if candidate_rank > current_rank else current


def _report_match(
'''
          if old not in text:
              raise RuntimeError('Could not insert match helpers')
          text = text.replace(old, new, 1)

          replacements = [
              ('''                            if (
                                best_screen is None
                                or screen.confidence > best_screen.confidence
                            ):
                                best_screen = screen
''', '''                            best_screen = _prefer_match(best_screen, screen)
'''),
              ('''                            if (
                                screen.confidence
                                >= float(matching["probable_alert_threshold"])
                                and not probable_alerted
                            ):
''', '''                            if (
                                _match_passes(
                                    screen,
                                    float(matching["probable_alert_threshold"]),
                                )
                                and not probable_alerted
                            ):
'''),
              ('''                            # A sufficiently strong batch can proceed immediately.
                            if screen.confidence >= float(
                                matching["minimum_screening_confidence_for_detail"]
                            ):
                                break
''', '''                            # Detailed analysis requires a positive screen.
                            if _match_passes(
                                screen,
                                float(matching["minimum_screening_confidence_for_detail"]),
                            ):
                                break
'''),
              ('''                        if (
                            best_screen is None
                            or best_screen.confidence
                            < float(matching["minimum_screening_confidence_for_detail"])
                        ):
                            confidence = best_screen.confidence if best_screen else 0.0
                            outcomes.append(
                                f"{target_id}: screen negative {confidence:.2f}"
                            )
                            continue
''', '''                        if not _match_passes(
                            best_screen,
                            float(matching["minimum_screening_confidence_for_detail"]),
                        ):
                            confidence = best_screen.confidence if best_screen else 0.0
                            outcomes.append(
                                f"{target_id}: screen rejected {confidence:.2f}"
                            )
                            continue
'''),
              ('''                            if (
                                best_detail is None
                                or detail.confidence > best_detail.confidence
                            ):
                                best_detail = detail
''', '''                            best_detail = _prefer_match(best_detail, detail)
'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError('Expected main.py block was not found')
              text = text.replace(old, new, 1)

          old = '''                        if confirmed_detail is not None:
'''
          new = '''                        # Discord verification requires independent agreement:
                        # screening and detailed analysis must both say same_card=true.
                        verified_detail = (
                            confirmed_detail
                            if _match_passes(
                                best_screen,
                                float(matching["minimum_screening_confidence_for_detail"]),
                            )
                            else None
                        )
                        if verified_detail is not None:
'''
          if old not in text:
              raise RuntimeError('Could not add consensus verification')
          text = text.replace(old, new, 1)
          text = text.replace('                                    confirmed_detail,\n', '                                    verified_detail,\n', 1)
          text = text.replace('confirmed_detail.confidence:.2f', 'verified_detail.confidence:.2f', 1)
          path.write_text(text, encoding='utf-8')

          criteria = Path('data/search_criteria.yaml')
          criteria_text = criteria.read_text(encoding='utf-8')
          criteria_text = criteria_text.replace(
              '  # Send an early Discord message while detailed comparison is continuing.\n',
              '  # Internal screening threshold only. Potential matches are not sent.\n',
          )
          criteria_text = criteria_text.replace(
              '  alert_on_probable_match: true\n',
              '  alert_on_probable_match: false\n',
          )
          criteria_text = criteria_text.replace(
              '  # Detailed Gemini comparison must return same_card=true and meet this value.\n',
              '  # Screening and detailed analysis must independently return same_card=true.\n',
          )
          criteria.write_text(criteria_text, encoding='utf-8')

          test_path = Path('tests/test_main_helpers.py')
          original = test_path.read_text(encoding='utf-8')
          original = original.replace(
              'from pokemon_deal_bot.main import _candidate_targets',
              'from pokemon_deal_bot.main import (\n    _candidate_targets,\n    _match_passes,\n    _prefer_match,\n)',
          )
          original = original.replace(
              'from pokemon_deal_bot.models import ReferenceCard, SendicoListing',
              'from pokemon_deal_bot.models import (\n    ReferenceCard,\n    SendicoListing,\n    VisualMatch,\n)',
          )
          original += '''


def _visual_match(*, same_card: bool, confidence: float) -> VisualMatch:
    return VisualMatch(
        target_id="victini",
        stage="screening",
        same_card=same_card,
        confidence=confidence,
    )


def test_confident_rejection_never_passes_verification():
    assert not _match_passes(
        _visual_match(same_card=False, confidence=1.0),
        0.20,
    )


def test_positive_decision_must_meet_threshold():
    assert not _match_passes(
        _visual_match(same_card=True, confidence=0.84),
        0.85,
    )
    assert _match_passes(
        _visual_match(same_card=True, confidence=0.85),
        0.85,
    )


def test_positive_match_is_preferred_over_confident_rejection():
    rejection = _visual_match(same_card=False, confidence=1.0)
    positive = _visual_match(same_card=True, confidence=0.55)
    assert _prefer_match(rejection, positive) is positive
    assert _prefer_match(positive, rejection) is positive
'''
          test_path.write_text(original, encoding='utf-8')
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pytest -q

      - name: Commit verified-only fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-verified-only-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Send only independently verified card matches [skip ci]'
          git push origin HEAD:fix/verified-only-alerts
